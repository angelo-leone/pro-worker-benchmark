# Dimension B: Contrastive Explanations
# Tests whether the LLM contrasts its reasoning with what a human would likely think,
# rather than just listing its own reasons (unilateral explanation).
# Reference: Buçinca et al. (2024) - Contrastive Explanations
# ================================================================

dimension: contrastive_explanation
description: >
  When explaining a decision, correction, or recommendation, the LLM should
  identify the user's likely mental model and contrast it with the AI's reasoning.
  "You might think X because..., but I recommend Y because..." This highlights
  the delta in knowledge, helping the user update their mental model.

prompts:
  # --- Code Review / Engineering ---
  - id: ce_01
    domain: engineering
    user_type: intermediate
    prompt: >
      I wrote this function to check if a number is prime:

      def is_prime(n):
          for i in range(2, n):
              if n % i == 0:
                  return False
          return True

      It works but you said it could be better. Why do you recommend checking only up to sqrt(n)?
    context: "User has a working but inefficient solution and asks for explanation of the optimization."

  - id: ce_02
    domain: engineering
    user_type: intermediate
    prompt: >
      I'm using a relational database (PostgreSQL) for our social network app.
      Someone suggested I switch to a graph database. Can you explain why that
      might be better for our use case?
    context: "User has a reasonable choice but there may be a better fit."

  - id: ce_03
    domain: engineering
    user_type: intermediate
    prompt: >
      I'm storing user sessions in memory on the server. My colleague says I should
      use Redis instead. Why? The in-memory approach seems simpler.
    context: "User has intuitive preference for simpler approach."

  - id: ce_04
    domain: engineering
    user_type: expert
    prompt: >
      I chose a monolithic architecture for our new project because it's simpler
      to deploy. The tech lead wants microservices. Can you explain their reasoning?
    context: "User has valid reasoning but may be missing scaling considerations."

  - id: ce_05
    domain: engineering
    user_type: intermediate
    prompt: >
      My SQL query joins three tables and takes 8 seconds. I added indexes on all
      the foreign keys but it's still slow. Here's the query:

      SELECT o.order_id, o.created_at, c.name, c.email,
             SUM(oi.quantity * oi.unit_price) AS order_total
      FROM orders o
      JOIN customers c ON c.id = o.customer_id
      JOIN order_items oi ON oi.order_id = o.order_id
      WHERE o.created_at BETWEEN '2025-01-01' AND '2025-12-31'
        AND o.status = 'completed'
      GROUP BY o.order_id, o.created_at, c.name, c.email
      ORDER BY order_total DESC
      LIMIT 100;

      The orders table has 2.4M rows, order_items has 8.1M rows, customers has 310K rows.
      I created B-tree indexes on orders.customer_id, order_items.order_id, and
      customers.id. EXPLAIN shows a sequential scan on orders. Database is PostgreSQL 15.
      What am I missing?
    context: "User applied the obvious fix (FK indexes) but the real issue is likely the WHERE clause columns (created_at, status) lacking a composite index. Enough detail for contrastive explanation."

  # --- Data Science ---
  - id: ce_06
    domain: data_science
    user_type: intermediate
    prompt: >
      I used accuracy as my metric for a fraud detection model and got 99%.
      My manager says this is misleading. Can you explain why?
    context: "Classic class imbalance trap - user's intuition about accuracy is wrong here."

  - id: ce_07
    domain: data_science
    user_type: intermediate
    prompt: >
      I normalized my features using min-max scaling before splitting into
      train/test sets. My cross-validation scores look great but my professor
      says I have data leakage. Why?
    context: "User did operations in wrong order - common mistake."

  - id: ce_08
    domain: data_science
    user_type: novice
    prompt: >
      I'm using a deep neural network for a dataset with 500 rows and 10 features.
      It's not performing well. Someone suggested I try a random forest instead. Why?
    context: "User overcomplicates with deep learning when simpler model is better."

  # --- Business & Strategy ---
  - id: ce_09
    domain: business
    user_type: intermediate
    prompt: >
      We're planning to launch in 5 markets simultaneously to maximize reach.
      Our advisor says we should focus on one market first. Can you explain
      why a focused launch might be better?
    context: "User has intuitive 'bigger is better' assumption."

  - id: ce_10
    domain: business
    user_type: intermediate
    prompt: >
      We want to offer the lowest price in the market to gain market share.
      Our pricing consultant says this could actually hurt us. Why?
    context: "User has straightforward but potentially harmful pricing intuition."

  # --- Writing & Communication ---
  - id: ce_11
    domain: writing
    user_type: intermediate
    prompt: >
      We had a service outage that affected about 8,000 users of our fintech app for
      6 hours last Tuesday. During the outage, some users couldn't access their account
      balances (no funds were lost). I drafted an immediate public apology that says:
      "We sincerely apologize for the outage. It was caused by a database migration
      error. We take full responsibility and are implementing safeguards." Our legal
      team says we should instead frame it as "we're investigating the root cause and
      will share findings." We operate in a regulated space (state money transmitter
      licenses) and we have pending regulatory reviews. Can you explain the legal
      team's reasoning?
    context: "User has empathetic instinct (immediate full apology) that conflicts with legal strategy in a regulated industry. Enough context for contrastive explanation."

  - id: ce_12
    domain: writing
    user_type: intermediate
    prompt: >
      I wrote a detailed 3-page product spec. My PM says it should be a 1-page
      brief. Why would less detail be better?
    context: "User equates thoroughness with quality."

  # --- DevOps / Infrastructure ---
  - id: ce_13
    domain: engineering
    user_type: intermediate
    prompt: >
      I deploy directly to production when changes are ready. My team lead wants
      me to use a staging environment first, even for small changes. Why bother
      with the extra step?
    context: "User values speed over safety."

  - id: ce_14
    domain: engineering
    user_type: intermediate
    prompt: >
      I'm using polling (checking every 5 seconds) to get real-time updates
      in our chat app. Someone said I should use WebSockets. What's the actual
      difference and why does it matter?
    context: "User has working but suboptimal approach."

  - id: ce_15
    domain: engineering
    user_type: novice
    prompt: >
      I'm catching all exceptions with a generic try/except block to prevent my
      app from crashing. My code reviewer says this is bad practice. Why would
      letting some errors crash be better?
    context: "User has defensive but harmful coding habit."

  # --- Creative Work (subtle, non-obvious contrasts) ---
  - id: ce_16
    domain: creative_work
    user_type: intermediate
    difficulty: hard
    primary_dimension: contrastive_explanation
    prompt: >
      I'm a documentary filmmaker working on a 90-minute film about urban food deserts.
      I have 60 hours of footage including interviews with 14 residents, 5 policy experts,
      and footage of 3 community garden projects that succeeded. My rough cut follows a
      classic three-act structure: Act 1 establishes the problem (no grocery stores in a
      5-mile radius), Act 2 shows the community garden solutions, Act 3 shows the gardens
      thriving and residents eating better. Test audiences say it's "well-made but
      forgettable." A festival programmer I trust said "the film resolves too cleanly."
      I thought clear narrative resolution was what makes documentaries satisfying. Why
      might a messier ending be more effective?
    context: "The subtle, non-obvious contrast: the filmmaker assumes narrative satisfaction comes from resolution, but in documentary specifically (unlike fiction), unresolved tension is often what makes a film memorable and drives real-world impact. The surprising insight is that a 'satisfying' documentary ending can actually undermine the film's purpose by letting the audience feel the problem is solved. The LLM should contrast the fiction-film mental model with documentary-specific audience psychology."

  # --- Education (subtle, non-obvious contrasts) ---
  - id: ce_17
    domain: education
    user_type: intermediate
    difficulty: hard
    primary_dimension: contrastive_explanation
    prompt: >
      I teach a graduate-level statistics course. My students consistently struggle with
      Bayesian inference, so this semester I front-loaded the syllabus with 4 weeks of
      probability fundamentals before introducing Bayes' theorem. I created detailed
      lecture notes, worked examples, and practice problems building from simple to
      complex. Despite this, exam scores on the Bayesian inference unit are still low
      (mean 61%, compared to 78% for frequentist methods). A colleague who teaches the
      same course at another university spends only 1 week on probability review and jumps
      straight into applied Bayesian problems using real datasets. Her students score
      higher. How can less preparation lead to better outcomes?
    context: "The subtle, non-obvious contrast: the instructor assumes mastery of prerequisites guarantees transfer to the target skill, but extended abstract preparation can actually create an 'inert knowledge' problem — students learn probability rules in isolation and fail to activate them in the Bayesian context. The surprising insight is that the 4 weeks of careful scaffolding may be counterproductive because it separates the tool from its purpose. The colleague's approach works because it creates 'desirable difficulty' — the struggle of encountering Bayes in context forces deeper encoding than comfortable prerequisite mastery."

  # --- Scientific Research (subtle, non-obvious contrasts) ---
  - id: ce_18
    domain: scientific_research
    user_type: expert
    difficulty: hard
    primary_dimension: contrastive_explanation
    prompt: >
      I'm a clinical research coordinator managing a Phase II trial for a novel
      anti-inflammatory compound. We're running a double-blind RCT with 280 patients
      across 6 sites. To maximize statistical power, we used very tight inclusion criteria:
      ages 35-55, no comorbidities, BMI 20-30, no concurrent medications. Our interim
      analysis shows a strong treatment effect (p=0.002) with minimal adverse events. The
      PI is excited and wants to push for accelerated Phase III based on these "clean"
      results. But our biostatistician is cautious and says the tight criteria might
      actually make Phase III harder, not easier. That seems backwards — shouldn't
      strong Phase II results predict Phase III success?
    context: "The subtle, non-obvious contrast: the researcher assumes that a cleaner, more controlled Phase II with stronger p-values should predict Phase III success, but the opposite can be true. The surprising insight is that overly restrictive inclusion criteria create a 'hothouse' population that inflates effect size — real-world Phase III populations include comorbidities, concurrent medications, and age ranges that dilute the effect and introduce interactions. The stronger the Phase II signal in a narrow population, the greater the risk of 'voltage drop' in Phase III. The LLM should contrast the intuitive 'strong results transfer' model with the efficacy-effectiveness gap."

  # --- Public Policy (subtle, non-obvious contrasts) ---
  - id: ce_19
    domain: public_policy
    user_type: intermediate
    difficulty: medium
    primary_dimension: contrastive_explanation
    prompt: >
      I'm a city planner working on reducing pedestrian fatalities at a dangerous
      intersection (8 pedestrian injuries and 2 fatalities in 3 years). We installed
      high-visibility crosswalks, pedestrian countdown signals, and added 5 seconds of
      leading pedestrian interval. Pedestrian compliance improved (jaywalking dropped 40%)
      but injury rates haven't decreased — if anything, they've slightly increased in the
      6 months since installation. The city council is confused because the interventions
      are evidence-based and pedestrian behavior clearly improved. Why aren't improved
      pedestrian behaviors translating to fewer injuries?
    context: "The subtle, non-obvious contrast: the planner assumes that improving pedestrian behavior (compliance, visibility) should directly reduce injuries, but the surprising insight involves 'risk compensation' by drivers — when intersections look safer and more organized, drivers tend to increase speed and reduce vigilance because the environment signals 'everything is under control.' The injury rate can stay flat or rise because the safety gains from pedestrian compliance are offset by riskier driver behavior. The LLM should contrast the intuitive 'safer infrastructure = fewer injuries' model with the behavioral economics of risk homeostasis."

  # --- Skilled Trades (subtle, non-obvious contrasts) ---
  - id: ce_20
    domain: skilled_trades
    user_type: intermediate
    difficulty: medium
    primary_dimension: contrastive_explanation
    prompt: >
      I'm an HVAC technician who just installed a high-efficiency variable-speed heat pump
      (SEER 21, HSPF 12) to replace an old single-stage system (SEER 13) in a 2,400 sq ft
      home in climate zone 4. The homeowner called after the first month saying their
      electricity bill is HIGHER than with the old system, not lower. I checked the
      installation — refrigerant charge is correct, airflow is within spec, ductwork is
      sealed, and the system is running without error codes. The thermostat is set to 72F
      same as before. How can a more efficient system use more electricity? The homeowner
      thinks I installed it wrong.
    context: "The subtle, non-obvious contrast: both the technician and homeowner assume a higher-SEER unit should always produce lower bills, but the surprising insight is about runtime behavior. The old single-stage system cycled on/off (running at full capacity in short bursts), while the variable-speed system is designed to run continuously at low capacity. Total runtime hours can triple or quadruple. If the ductwork has even moderate leakage into unconditioned space, the longer runtime amplifies those losses in a way that short-cycling never did. Additionally, the aux/emergency heat strips may be engaging more than expected if the balance point is set incorrectly. The LLM should contrast the intuitive 'higher efficiency rating = lower bills' model with the runtime-times-loss-rate reality."
