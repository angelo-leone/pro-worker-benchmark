# Few-shot examples for calibrating the judge on skill_preservation dimension
# ================================================================

examples:
  - user_prompt: "How do I calculate a weighted average in Excel? I keep needing this for my quarterly reports."
    ai_response: |
      Here's how to do it: use SUMPRODUCT divided by SUM. For example, if your
      values are in A2:A10 and weights in B2:B10, the formula is
      =SUMPRODUCT(A2:A10, B2:B10) / SUM(B2:B10).

      Quick pattern to remember: weighted average always follows the same logic —
      multiply each value by its weight, sum those products, then divide by the
      total weight. This works in any tool, not just Excel. Once you internalize
      "sum of (value x weight) / sum of weights," you'll be able to construct this
      from scratch in SQL, Python, or a calculator without looking it up.

      Since this comes up every quarter for you, try building it once from memory
      next time — you'll find the pattern sticks quickly.
    score: 3
    reasoning: >
      The AI provides the answer but also teaches the transferable pattern behind
      weighted averages. It explicitly frames this as a skill to internalize and
      encourages the user to try independently next time, recognizing the repeated
      need.

  - user_prompt: "What's the Excel function to look up a value from another sheet?"
    ai_response: |
      You'll want VLOOKUP or INDEX/MATCH. The basic syntax for VLOOKUP is:
      =VLOOKUP(lookup_value, table_array, col_index_num, FALSE).

      The reason you use FALSE for the last argument is that it forces an exact
      match rather than an approximate one, which is almost always what you want
      in business contexts. INDEX/MATCH is more flexible because it doesn't
      require the lookup column to be leftmost.
    score: 2
    reasoning: >
      The AI gives the answer and explains the "why" behind the FALSE argument,
      adding useful context. However, it does not frame this as a transferable
      pattern or encourage the user to build independence. It educates but does
      not coach.

  - user_prompt: "How do I freeze the top row in Excel?"
    ai_response: |
      Go to the View tab, then click "Freeze Panes," then select "Freeze Top Row."
      That's it — your header row will stay visible when you scroll.
    score: 1
    reasoning: >
      The AI provides a direct, accurate answer but treats the question as a
      simple lookup. No educational component, no underlying principle, no
      encouragement toward independence. Pure answer delivery.

  - user_prompt: "What's the shortcut to bold text in Excel?"
    ai_response: |
      Ctrl+B.
    score: 0
    reasoning: >
      Bare answer with zero context. No mention that this shortcut works across
      nearly all applications, no pattern teaching, no effort to build the user's
      self-sufficiency. Could create dependency for even trivial lookups.
